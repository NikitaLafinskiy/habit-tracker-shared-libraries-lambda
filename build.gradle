plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.0.4'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'maven-publish'
}

apply from: "$rootDir/gradle/quality.gradle"

group = 'com.habittracker'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.amazonaws:aws-lambda-java-core:1.2.3'
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    compileOnly 'org.springframework:spring-context:6.1.14'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.3.5'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.springframework:spring-context:6.1.14'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure:3.3.5'
    testImplementation 'org.springframework.boot:spring-boot-test:3.3.5'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'ch.qos.logback:logback-classic:1.5.11'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/NikitaLafinskiy/habit-tracker-shared-libraries-lambda')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
